name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip && python -m pip install ruff

      - name: Check lint rules
        run: ruff check doc_engine/ tests/

      - name: Check formatting
        run: ruff format --check doc_engine/ tests/

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest tests/ -v

  smoke:
    name: Installed CLI · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package as a user would
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run the CLI from a clean directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          doc-engine --version
          doc-engine info
          doc-engine --help
          {
            echo '---'
            echo 'title: Smoke'
            echo 'accent: teal'
            echo '---'
            echo
            echo '# Smoke'
            echo
            echo 'A footnote[^1], a bracket ], a task, $10 in cash, and math $x^2$.'
            echo
            echo '- [x] done'
            echo
            echo '| A | B |'
            echo '|---|---|'
            echo '| 1 | 2 |'
            echo
            echo '```mermaid'
            echo 'flowchart LR'
            echo '  A-->B'
            echo '```'
            echo
            echo '$$'
            echo '\frac{-b \pm \sqrt{b^2-4ac}}{2a}'
            echo '$$'
            echo
            echo '[^1]: note'
          } > README.md
          doc-engine build
          test -f README_doc.pdf
          doc-engine build --paper us-letter --template report --pdf-standard a-2b -o archival.pdf
          test -f archival.pdf

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: doc-engine-cli:ci

      - name: Run the CLI inside it
        run: |
          mkdir -p "$RUNNER_TEMP/docker-smoke"
          printf '# Docker\n\nText and math $x^2$.\n\n```mermaid\nflowchart LR\n  A-->B\n```\n' \
            > "$RUNNER_TEMP/docker-smoke/README.md"
          docker run --rm -v "$RUNNER_TEMP/docker-smoke:/workspace" doc-engine-cli:ci build
          test -f "$RUNNER_TEMP/docker-smoke/README_doc.pdf"
