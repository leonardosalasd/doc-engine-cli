name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      # PyPI renders the README on its own page, where a relative path resolves
      # to nothing and every screenshot comes out broken. The repository keeps
      # the relative paths, because that is what lets doc-engine embed its own
      # images when it builds this file, and the copy that ships points at raw
      # GitHub instead.
      - name: Point README images at raw GitHub
        run: |
          python - <<'PY'
          import pathlib, re
          raw = "https://raw.githubusercontent.com/${{ github.repository }}/main/"
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = re.sub(r'(<img[^>]*\ssrc=")(?!https?://)(assets/)', rf'\1{raw}\2', text)
          text = re.sub(r'(!\[[^\]]*\]\()(?!https?://)(assets/)', rf'\1{raw}\2', text)
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Build package (sdist & wheel)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
